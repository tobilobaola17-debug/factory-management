<!DOCTYPE html>
<html>
<head>
    <title>Login - Factory Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; }
        button { background: #007BFF; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        p { margin: 5px 0; }
        .errorlist { color: red; font-size: 13px; list-style: none; padding: 0; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Factory Login</h2>
        <form method="post">
            {% csrf_token %} 
            {{ form.as_p }}
            <button type="submit">Log In</button>
        </form>
    <div style="text-align: center; margin-top: 15px;">
    Don't have an account? <a href="{% url 'register' %}">Sign up here</a>
    </div>
    </div>
</body>
</html>
